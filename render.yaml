services:
  - type: web
    name: portfolio-faith-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CHAT_ACCESS_PASSWORD
        sync: false
      - key: CHAT_RATE_LIMIT
        value: "20"
      - key: CHAT_RATE_WINDOW_MINUTES
        value: "30"
      - key: MOVIE_SESSION_SECRET
        sync: false
      - key: TMDB_API_KEY
        sync: false
